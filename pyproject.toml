[tool.poetry]
name = "homework"
version = "0.1.0"
description = ""
authors = ["Nikita Dorozhko <nick.dorozhko@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
poetry-core = "^2.1.3"
isort = ">=5.12.0"
black = ">=23.7.0"
flake8 = ">=6.0.0"
mypy = ">=1.1.1"
python-dotenv = "^1.1.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
pytest-cov = "^6.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
warn_unreachable = true

[tool.black]
line-length = 119
exclude = '.git'

[tool.isort]
line_length = 119
multi_line_output = 1